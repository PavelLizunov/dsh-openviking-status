name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        run: pnpm exec tsc --noEmit

      # The documented install URL is version-pinned on purpose (ADR 0004), so
      # it has to be bumped by hand and drifts silently — the stale command
      # still works, it just installs an old version.
      - name: Check README install URL matches package version
        run: node scripts/check-readme-version.mjs

      - name: Run automated test suite
        run: pnpm test

      - name: Build bundles
        run: pnpm run build
