name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        run: pnpm exec tsc --noEmit

      # Manifest details that only blow up after a tag is pushed: the
      # version-pinned install URL in README (ADR 0004) and repository.url,
      # which npm's provenance check compares against the building repo.
      - name: Check manifest consistency
        run: node scripts/check-readme-version.mjs

      - name: Run automated test suite
        run: pnpm test

      - name: Build bundles
        run: pnpm run build
