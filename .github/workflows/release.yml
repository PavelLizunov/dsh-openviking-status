name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Artifacts & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        run: pnpm exec tsc --noEmit

      - name: Run automated test suite
        run: pnpm test

      - name: Build plugin bundles
        run: pnpm run build

      # A packed tarball ships lib/ already built, so pnpm never runs the
      # `prepare` script on install — which is why it needs no `allowBuilds`
      # entry, unlike a `github:` spec. See docs/adr/0004-install-paths.md.
      # Only the versioned tarball is published. A version-free copy served via
      # /releases/latest/download/ would change content under a fixed URL, so
      # pnpm records no `integrity` for it and every later `pnpm install` in the
      # user's profile fails with ERR_PNPM_MISSING_TARBALL_INTEGRITY.
      - name: Prepare release artifacts
        run: |
          mkdir -p dist-release
          pnpm pack --pack-destination dist-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: publishing to npm unlocks `dsh plugin add <name>` with no URL
      # at all. Secrets are not readable from a step-level `if`, so the guard
      # lives inside the script: without an NPM_TOKEN the step no-ops and the
      # release still succeeds.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN not set — skipping npm publish."
            exit 0
          fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --access public
